		<title>thumbnail tests</title>
		<!--
			Exercises the Library's thumbnail path against a folder that exists only
			in memory: src/dev/fake-fs.js is swapped in for src/lib/fs.js by the
			import map below, so state.js and viewer.js run exactly as shipped.

			The point of interest is video thumbnails. There are no cover files in
			the archive any more, so a video tile's image is a frame decoded out of
			the .mp4 itself — and it must not be frame 0, which on TikTok is very
			often black. The sample clip is black for its first 0.2s and colour bars
			after, so a black thumbnail is a real failure and not a flaky one.

			Serve the repo (python -m http.server 8777) and open
			http://127.0.0.1:8777/src/dev/thumbs.html. Dev-only.
		-->

			body { background: #12121a; color: #e8e8f0; font: 14px/1.6 ui-monospace, monospace; padding: 24px; }

			.pass { color: #4ade80; }
			.fail { color: #f87171; }
			.tile { width: 120px; height: 200px; display: inline-block; }
			.tile img { max-width: 100%; }
		</style>
		<script type="importmap">
			{ "imports": { "/src/lib/fs.js": "/src/dev/fake-fs.js" } }
		</script>

				host.appendChild(el);
			}
			// applyFilters reads .value off these; a bare <select> gives ''.
			for (const [id, value] of [['sort', 'date-desc'], ['kind', 'all']]) {
				const sel = document.getElementById(id);
				const opt = document.createElement('option');
				opt.value = value;
				sel.appendChild(opt);
				sel.value = value;
			}

			function bytesFrom(b64) {
				const bin = atob(b64);
				const bytes = new Uint8Array(bin.length);
				for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
				return bytes;
			}

			function solidJPEG(colour) {
				const c = document.createElement('canvas');
				c.width = 40;
				c.height = 60;
				const ctx = c.getContext('2d');
				ctx.fillStyle = colour;
				ctx.fillRect(0, 0, c.width, c.height);
				return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
			}

			fake.seed('videos/111.mp4', new Blob([bytesFrom(SAMPLE_MP4)], { type: 'video/mp4' }));
			fake.seed('images/333_01.jpg', await solidJPEG('#ff0000'));
			fake.seed('images/333_02.jpg', await solidJPEG('#0000ff'));

			const counts = await scanDisk();
			check('scanDisk sees the flat layout', counts.videos === 1 && counts.photoSets === 1,

					333: { id: '333', type: 'photo', desc: 'a photo post', createTime: 2, author: {}, stats: {}, photoCount: 2, status: 'saved' },
					444: { id: '444', type: 'video', desc: 'never downloaded', createTime: 1, author: {}, stats: {}, status: 'pending' },
				},
				authors: {},
			};

			wireLibrary(() => state);
			renderLibrary(state);

			const tileFor = (id) => document.querySelector(`.tile[data-id="${id}"]`);
			check('every known item gets a tile', document.querySelectorAll('.tile').length === 3);
			check('an item with no files is marked missing', tileFor('444')?.classList.contains('missing') === true);
			check('an item with files is not marked missing', tileFor('111')?.classList.contains('missing') === false);

			// ---- thumbnails ------------------------------------------------------
			// Driven directly rather than through the tiles' IntersectionObserver,
			// which needs a rendered page and so can't run in a headless check.
			function decode(url) {
				return new Promise((resolve) => {
					if (!url) return resolve(null);
					const img = new Image();
					img.onload = () => resolve(img);
					img.onerror = () => resolve(null);
					img.src = url;
				});
			}

			const photoThumb = await decode(await loadThumb('333'));
			check('a photo post is thumbnailed from its first image', !!photoThumb, 'no image was produced');
			check('an item with no file gets no thumbnail', (await loadThumb('444')) === null);

			const videoThumb = await decode(await loadThumb('111'));
			check('a video is thumbnailed from a decoded frame', !!videoThumb,
				'no frame was decoded — the archive has no cover files to fall back on');

			if (videoThumb) {
				check('the decoded frame keeps the clip aspect ratio',
					Math.abs(videoThumb.naturalWidth / videoThumb.naturalHeight - 144 / 256) < 0.05,
					`${videoThumb.naturalWidth}x${videoThumb.naturalHeight}`);

				const c = document.createElement('canvas');
				c.width = videoThumb.naturalWidth;
				c.height = videoThumb.naturalHeight;
				const ctx = c.getContext('2d');
				ctx.drawImage(videoThumb, 0, 0);
				const px = ctx.getImageData(0, 0, c.width, c.height).data;
				let sum = 0;
				for (let i = 0; i < px.length; i += 4) sum += px[i] + px[i + 1] + px[i + 2];
				const mean = sum / (px.length / 4) / 3;
				check('the frame is not the black one at t=0', mean > 12,
					`mean luminance ${mean.toFixed(1)} — looks like frame 0 was taken`);

				const t0 = performance.now();
				await loadThumb('111');
				check('a second look at the same video is served from cache',
					performance.now() - t0 < 30, `took ${(performance.now() - t0).toFixed(0)}ms`);
			}

			// ---- playback --------------------------------------------------------
			tileFor('111').click();
			await sleep(400);
			check('clicking a video opens it in the lightbox', !!document.querySelector('#lbStage video')?.src);
			check('the lightbox reports the item status',
				document.getElementById('lbMeta').textContent.includes('saved'));
			document.getElementById('lbClose').click();

			tileFor('333').click();
			await sleep(600);
			const opened = document.querySelectorAll('#lbStage img').length;
			check('a photo post opens every image in order', opened === 2, `got ${opened}`);
			document.getElementById('lbClose').click();

			lines.push('', failures
				? `<span class="fail">${failures} of ${checks} failing</span>`
				: `<span class="pass">all ${checks} passing</span>`);
			out.innerHTML = lines.join('\n');
