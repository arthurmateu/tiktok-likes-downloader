<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>TikTok Likes Archiver</title>
		<style>
			body {
				width: 260px;
				margin: 0;
				padding: 14px;
				background: #1b1c1f;
				color: #e6e7ea;
				font: 13px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			h1 {
				font-size: 14px;
				margin: 0 0 4px;
			}
			p {
				color: #9aa0a8;
				margin: 0 0 12px;
			}
			button {
				width: 100%;
				background: #4cc2ff;
				color: #04263a;
				border: 0;
				border-radius: 8px;
				padding: 9px;
				font-weight: 600;
				font-size: 13px;
				cursor: pointer;
			}
			#status {
				margin-top: 10px;
				color: #9aa0a8;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h1>TikTok Likes Archiver</h1>
		<p>All the work happens on the archive page, which needs a tab to hold your folder permission.</p>
		<button id="open">Open archive</button>
		<div id="status"></div>
		<script src="popup.js"></script>
	</body>
</html>
