<!doctype html>
<!-- Dev-only harness: parses every module + classic script so syntax errors surface. Not shipped. -->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>syntax check</title>
	</head>
	<body>
		<pre id="out">running…</pre>
		<script>
			// Enough of the extension API surface for the files to evaluate.
			const noop = () => {};
			window.chrome = {
				runtime: {
					connect: () => ({
						onMessage: { addListener: noop },
						// A real port has this, and the archive page reopens itself
						// when it fires — Chromium disconnects one every time it stops
						// the idle service worker.
						onDisconnect: { addListener: noop },
						postMessage: noop,
						name: 'archive',
					}),
					sendMessage: () => Promise.resolve(),
					onMessage: { addListener: noop },
					onConnect: { addListener: noop },
					onInstalled: { addListener: noop },
					getManifest: () => ({ host_permissions: ['*://*.tiktok.com/*'] }),
					getURL: (p) => p,
				},
				tabs: {
					query: () => Promise.resolve([]),
					sendMessage: () => Promise.resolve({}),
					create: () => Promise.resolve({}),
					update: () => Promise.resolve({}),
					get: () => Promise.resolve({ status: 'complete' }),
					onUpdated: { addListener: noop, removeListener: noop },
				},
				windows: { update: noop },
				storage: { local: { get: () => Promise.resolve({}), set: () => Promise.resolve() } },
				permissions: {
					contains: () => Promise.resolve(true),
					request: () => Promise.resolve(true),
				},
				downloads: {
					download: () => Promise.resolve(1),
					search: () => Promise.resolve([]),
					onChanged: { addListener: noop, removeListener: noop },
				},
			};

			// `?gecko` selects the downloads backend instead of File System Access,
			// so the Firefox path gets evaluated rather than just parsed.
			if (new URLSearchParams(location.search).has('gecko')) {
				delete window.showDirectoryPicker;
				window.browser = window.chrome;
			}
		</script>

		<!-- The archive page's own DOM, so archive.js/viewer.js can bind to it. -->
		<div hidden id="dom"></div>

		<script>
			const IDS = [
				'folderName','pickFolder','grantFolder','noFolder','syncBody','legacyNote','username',
				'concurrency','startSync','syncMode','syncMenu','stopSync','rescan','writeViewer','bar','cSeen','cNew','cDone','cSkip',
				'cFail','cBytes','log','loading','loadingMsg','statPosts','statVideos','statImages','statUnavailable','search',
				'sort','kind','libCount','grid','libMore','loadMore','lightbox','lbClose','lbStage','lbMeta',
				'hostAccess','grantHost','dlSetup','dlFolderName','dlFolderSave','scanRow','scanFolder','scanInput',
			];
			const INPUTS = ['search','username','concurrency','dlFolderName','scanInput'];
			const host = document.getElementById('dom');
			for (const id of IDS) {
				const tag = INPUTS.includes(id) ? 'input'
					: ['sort','kind'].includes(id) ? 'select' : 'div';
				const el = document.createElement(tag);
				el.id = id;
				el.classList.add('hidden');
				host.appendChild(el);
			}
			const t = document.createElement('button');
			t.className = 'tab';
			t.dataset.panel = 'sync';
			host.appendChild(t);
			const p = document.createElement('section');
			p.id = 'panel-sync';
			p.className = 'panel';
			host.appendChild(p);
		</script>

		<script type="module">
			const out = document.getElementById('out');
			const lines = [];
			const mods = [
				'./src/lib/idb.js',
				'./src/lib/ext.js',
				'./src/lib/backends/fsa.js',
				'./src/lib/backends/downloads.js',
				'./src/lib/fs.js',
				'./src/lib/state.js',
				'./src/lib/downloader.js',
				'./src/archive/viewer.js',
				'./src/archive/standalone.js',
				'./src/archive/archive.js',
				'./src/background.js',
			];
			for (const m of mods) {
				try {
					await import(m);
					lines.push(`OK      ${m}`);
				} catch (e) {
					lines.push(`FAIL    ${m}\n        ${e.name}: ${e.message}`);
				}
			}
// Classic scripts, plus the viewer runtime — which is never loaded as a
			// file by anything and would otherwise only be parsed once it was already
			// inlined into someone's archive folder.
			const classics = [
				'./src/content/hook.js',
				'./src/content/collector.js',
				'./src/content/viewer-bridge.js',
				'./src/popup/popup.js',
				'./src/viewer/viewer.js',
			];
			for (const s of classics) {
				try {
					const src = await (await fetch(s)).text();
					new Function(src);
					lines.push(`OK      ${s}`);
				} catch (e) {
					lines.push(`FAIL    ${s}\n        ${e.name}: ${e.message}`);
				}
			}
			try {
				const fs = await import('./src/lib/fs.js');
				lines.push(`\nbackend ${fs.backendId()}  ${JSON.stringify(fs.capabilities)}`);
			} catch (_) {
				lines.push('\nbackend —  (fs.js did not load)');
			}

			out.textContent = lines.join('\n');
			console.log('SYNTAXCHECK\n' + lines.join('\n'));
		</script>
	</body>
</html>
