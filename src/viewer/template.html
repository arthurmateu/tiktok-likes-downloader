<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			This file was generated by the TikTok Likes Archiver into your archive
			folder. It is self-contained: the metadata below is baked in, and the
			media loads from videos/ and images/ next to this file. Copy the whole
			folder anywhere and it still opens.

			The meta tag below is what the extension's content script looks for
			before it will talk to this page, and its value is a token only that
			extension knows. Neither is a secret worth protecting — they exist so
			that opening some *other* local HTML file can't drive the extension.
		-->
		<meta name="ttarchive-viewer" content="__TOKEN__" />
		<title>__TITLE__</title>
		<style>
			/*__CSS__*/
		</style>
	</head>
	<body>
		<header class="topbar">
			<div>
				<h1>__TITLE__</h1>
				<div class="sub" id="sub"></div>
			</div>
			<div class="row" style="margin: 0">
				<input id="search" type="search" placeholder="Search caption, hashtag, author…" />
				<select id="sort">
					<option value="date-desc">Newest first</option>
					<option value="date-asc">Oldest first</option>
					<option value="likes-desc">Most liked</option>
					<option value="plays-desc">Most played</option>
				</select>
				<select id="kind">
					<option value="all">All types</option>
					<option value="video">Videos</option>
					<option value="photo">Photo posts</option>
				</select>
			</div>
		</header>

		<main>
			<div id="banner" class="banner hidden"></div>
			<div id="grid" class="grid"></div>
			<div id="more" class="center hidden"><button id="loadMore" class="btn">Load more</button></div>
			<div id="empty" class="center muted hidden">Nothing matches that filter.</div>
		</main>

		<div id="lightbox" class="lightbox hidden">
			<div id="lbCount" class="lb-count"></div>
			<button id="lbClose" class="lb-close" title="Close (Esc)">✕</button>
			<div id="lbStage" class="lb-stage"></div>
			<div class="lb-nav">
				<button id="lbPrev" class="lb-step" title="Previous (↑)">↑</button>
				<button id="lbNext" class="lb-step" title="Next (↓)">↓</button>
			</div>
			<div id="lbMeta" class="lb-meta"></div>
			<div class="lb-hint">
				scroll or ↑ ↓ — next · ← → — images in a post · g — all of them · space — play · m — mute · esc — close
			</div>
		</div>

		<script type="application/json" id="ttarchive-data">
			__DATA__
		</script>
		<script>
			/*__JS__*/
		</script>
	</body>
</html>
