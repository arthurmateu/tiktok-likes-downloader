	<head>
		<meta charset="utf-8" />
		<title>thumbnail tests</title>
		<!--
			Exercises the Library's thumbnail path against a folder that exists only
			in memory: src/dev/fake-fs.js is swapped in for src/lib/fs.js by the
			import map below, so state.js and viewer.js run exactly as shipped.

			The point of interest is video thumbnails. There are no cover files in
			the archive any more, so a video tile's image is a frame decoded out of
			the .mp4 itself — and it must not be frame 0, which on TikTok is very
			often black. The sample clip is black for its first 0.2s and colour bars
			after, so a black thumbnail is a real failure and not a flaky one.

			Serve the repo (python -m http.server 8777) and open
			http://127.0.0.1:8777/src/dev/thumbs.html. Dev-only.
		-->

			body { background: #12121a; color: #e8e8f0; font: 14px/1.6 ui-monospace, monospace; padding: 24px; }
			pre { white-space: pre-wrap; }
			.pass { color: #4ade80; }
			.fail { color: #f87171; }
			.tile { width: 120px; height: 200px; display: inline-block; }
			.tile img { max-width: 100%; }
		</style>
		<script type="importmap">
			{ "imports": { "/src/lib/fs.js": "/src/dev/fake-fs.js" } }
		</script>

			for (const id of IDS) {

				el.id = id;

			// closed is this class.
			document.getElementById('lbHelp').classList.add('hidden');

			for (const [id, value] of [['sort', 'date-desc'], ['kind', 'all']]) {
				const sel = document.getElementById(id);
				const opt = document.createElement('option');
				opt.value = value;
				sel.appendChild(opt);
				sel.value = value;

			function bytesFrom(b64) {
				const bin = atob(b64);
				const bytes = new Uint8Array(bin.length);
				for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
				return bytes;
			}

			function solidJPEG(colour) {
				const c = document.createElement('canvas');
				c.width = 40;
				c.height = 60;
				const ctx = c.getContext('2d');
				ctx.fillStyle = colour;
				ctx.fillRect(0, 0, c.width, c.height);
				return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
			}

			/**
			 * A short silence, written out as a WAV by hand.
			 *
			 * The player only has to have a real file behind it — nothing here
			 * listens to it — and a WAV is the one format that can be built in a
			 * dozen lines rather than pasted in as a base64 fixture. The extension
			 * being .wav is also the point: what the CDN served decides it, which is
			 * why the file name is what the folder scan remembers.
			 */
			function silentWAV(seconds = 0.4) {
				const rate = 8000;
				const samples = Math.floor(rate * seconds);
				const view = new DataView(new ArrayBuffer(44 + samples * 2));
				const ascii = (at, s) => {
					for (let i = 0; i < s.length; i++) view.setUint8(at + i, s.charCodeAt(i));
				};
				ascii(0, 'RIFF');
				view.setUint32(4, 36 + samples * 2, true);
				ascii(8, 'WAVEfmt ');
				view.setUint32(16, 16, true); // PCM header length
				view.setUint16(20, 1, true); // uncompressed
				view.setUint16(22, 1, true); // mono
				view.setUint32(24, rate, true);
				view.setUint32(28, rate * 2, true); // bytes per second
				view.setUint16(32, 2, true); // bytes per frame
				view.setUint16(34, 16, true); // bits per sample
				ascii(36, 'data');
				view.setUint32(40, samples * 2, true);
				return new Blob([view.buffer], { type: 'audio/wav' });
			}

			fake.seed('images/333_02.jpg', await solidJPEG('#0000ff'));
			fake.seed('audio/333.wav', silentWAV());

			const tileFor = (id) => document.querySelector(`.tile[data-id="${id}"]`);

			check('an item with no files is marked missing', tileFor('444')?.classList.contains('missing') === true);

			// ---- thumbnails ------------------------------------------------------
			// Driven directly rather than through the tiles' IntersectionObserver,
			// which needs a rendered page and so can't run in a headless check.
			function decode(url) {
				return new Promise((resolve) => {
					if (!url) return resolve(null);
					const img = new Image();
					img.onload = () => resolve(img);
					img.onerror = () => resolve(null);
					img.src = url;
				});
			}

			const photoThumb = await decode(await loadThumb('333'));
			check('a photo post is thumbnailed from its first image', !!photoThumb, 'no image was produced');
			check('an item with no file gets no thumbnail', (await loadThumb('444')) === null);

			const videoThumb = await decode(await loadThumb('111'));
			check('a video is thumbnailed from a decoded frame', !!videoThumb,
				'no frame was decoded — the archive has no cover files to fall back on');

			if (videoThumb) {
				check('the decoded frame keeps the clip aspect ratio',
					Math.abs(videoThumb.naturalWidth / videoThumb.naturalHeight - 144 / 256) < 0.05,
					`${videoThumb.naturalWidth}x${videoThumb.naturalHeight}`);

				const c = document.createElement('canvas');
				c.width = videoThumb.naturalWidth;
				c.height = videoThumb.naturalHeight;
				const ctx = c.getContext('2d');
				ctx.drawImage(videoThumb, 0, 0);
				const px = ctx.getImageData(0, 0, c.width, c.height).data;
				let sum = 0;
				for (let i = 0; i < px.length; i += 4) sum += px[i] + px[i + 1] + px[i + 2];
				const mean = sum / (px.length / 4) / 3;
				check('the frame is not the black one at t=0', mean > 12,
					`mean luminance ${mean.toFixed(1)} — looks like frame 0 was taken`);

				const t0 = performance.now();
				await loadThumb('111');
				check('a second look at the same video is served from cache',
					performance.now() - t0 < 30, `took ${(performance.now() - t0).toFixed(0)}ms`);
			}

			// ---- playback --------------------------------------------------------
			tileFor('111').click();
			await sleep(400);
			check('clicking a video opens it in the lightbox', !!document.querySelector('#lbStage video')?.src);
			// The id is the link out to the post, and the row anyone copies from.
			const idLink = document.querySelector('#lbMeta .lb-id a');
			check('the lightbox links the post by its id',
				idLink?.textContent.trim() === '111' && /\/video\/111$/.test(idLink?.href || ''), idLink?.href);
			// Status is only remarked on when it is worth remarking on: this item is
			// saved, like almost every item anyone opens, and a pill saying so on all
			// of them says nothing.
			check('a saved item wears no status pill', !document.querySelector('#lbMeta .pill'));
			// Volume on mpv's two keys. Read as a step from wherever the level is
			// rather than as an absolute: it is remembered between runs of this page.
			const clip = document.querySelector('#lbStage video');
			const level = clip.volume;
			document.dispatchEvent(new KeyboardEvent('keydown', { key: '9', bubbles: true }));
			check('9 takes the volume down a step',
				Math.abs(clip.volume - Math.max(0, level - 0.05)) < 1e-6, `${level} -> ${clip.volume}`);
			const lowered = clip.volume;
			document.dispatchEvent(new KeyboardEvent('keydown', { key: '0', bubbles: true }));
			check('0 puts it back up',
				Math.abs(clip.volume - Math.min(1, lowered + 0.05)) < 1e-6, `${lowered} -> ${clip.volume}`);

			// Speed, and the key that gives it up. Normalised first, since the rate is
			// remembered between runs of this page the same way the level is.
			const key = (k) => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
			key('Backspace');
			check('backspace comes back to normal speed', clip.playbackRate === 1, String(clip.playbackRate));
			key(']');
			check('] is still a rung up the ladder', clip.playbackRate === 1.25, String(clip.playbackRate));
			key('Backspace');
			check('and backspace drops the whole ladder', clip.playbackRate === 1, String(clip.playbackRate));

			// The shortcuts, which are a sheet behind the ? rather than a line of grey
			// text under every post.
			const keySheet = document.getElementById('lbHelp');
			document.getElementById('lbKeys').click();
			check('the ? button opens the shortcut sheet', !keySheet.classList.contains('hidden'));
			const caps = [...keySheet.querySelectorAll('kbd')].map((k) => k.textContent);
			check('the shortcuts are drawn as the keys themselves',
				['Backspace', 'Space', 'Esc', '9', '0', '←'].every((k) => caps.includes(k)), String(caps));
			check('and the sheet knows the speed reset by its new key', !caps.includes('\\'), String(caps));
			key('Escape');
			check('escape closes the sheet before it closes the post',
				keySheet.classList.contains('hidden') && !!document.querySelector('#lbStage video'));
			// Its sound is inside the mp4 already, so there is no second player — but
			// the name sits where a photo post's does, or stepping between the two
			// moves the row it sits on and everything under it.
			const videoSong = document.querySelector('#lbMeta .lb-song');
			check('a video names its song in the same place',
				videoSong?.previousElementSibling.className === 'lb-figs' &&
					videoSong?.nextElementSibling.className === 'lb-facts' &&
					videoSong?.querySelector('.name').textContent.includes('someone’s song'),
				videoSong?.textContent);
			check('and gets no second player over it', !videoSong?.querySelector('audio'));
			document.getElementById('lbClose').click();

			// A photo post opens one image at a time, the way TikTok's own slideshow
			// does; `g` is what opens the whole post out at once.
			tileFor('333').click();
			await sleep(600);
			const first = document.querySelectorAll('#lbStage img').length;
			check('a photo post opens one image at a time', first === 1, `got ${first}`);
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'g', bubbles: true }));
			await sleep(600);
			const sheet = document.querySelectorAll('#lbStage img').length;
			check('g opens every image of the post at once', sheet === 2, `got ${sheet}`);

			// ---- the song --------------------------------------------------------
			// A photo post on TikTok is a slideshow over a track, so the images on
			// their own are half of it.
			const player = document.querySelector('#lbMeta .lb-song');
			check('a photo post opens with its song', !!player);
			check('the song sits under the counts',
				player?.previousElementSibling.className === 'lb-figs' &&
					player?.nextElementSibling.className === 'lb-facts');
			check('it is labelled with the song',
				player?.querySelector('.name').textContent.includes('a song — Artist'),
				player?.querySelector('.name').textContent);

			const song = player?.querySelector('audio');
			check('and reads the file out of the folder', !!song?.src.startsWith('blob:'), song?.src);

			// The stage is rebuilt every time the images are paged, and the song has
			// to play across that rather than start over on each picture — which is
			// the whole reason it lives in the metadata panel.
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
			await sleep(400);
			check('paging the images leaves the song alone',
				document.querySelector('#lbMeta .lb-song audio') === song);

			// Speed belongs to video: it is a way of getting through one. A song at
			// 1.75× is just wrong, so the ladder deliberately doesn't reach it.
			document.dispatchEvent(new KeyboardEvent('keydown', { key: ']', bubbles: true }));
			await sleep(50);
			check('the speed keys do not touch it', song?.playbackRate === 1, String(song?.playbackRate));
			// Mute does carry, though: silencing the archive once has to silence all
			// of it, or stepping onto a photo post is a surprise. Read as a toggle
			// rather than an absolute — nothing here is a user gesture, so the
			// autoplay fallback has already muted this player on its own behalf.
			const wasMuted = song?.muted;
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'm', bubbles: true }));
			await sleep(50);
			check('mute reaches it', song?.muted === !wasMuted, `${wasMuted} -> ${song?.muted}`);
			document.dispatchEvent(new KeyboardEvent('keydown', { key: 'm', bubbles: true }));

			document.getElementById('lbClose').click();
			await sleep(50);
			check('closing the lightbox stops the song',
				song?.paused === true && !document.querySelector('#lbMeta .lb-song'));

			// ---- hashtags --------------------------------------------------------
			// Set apart from the sentence they are piled under, and each one a way
			// into everything else filed the same.
			tileFor('333').click();
			await sleep(400);
			const desc = document.querySelector('#lbMeta .lb-desc');
			check('the caption marks its hashtags',
				[...desc.querySelectorAll('.tag')].map((el) => el.textContent).join() === '#fyp',
				desc.textContent);
			check('and still reads as what the author wrote', desc.textContent === 'a photo post #fyp',
				desc.textContent);

			desc.querySelector('.tag').click();
			await sleep(50);
			check('clicking a tag searches for it', document.getElementById('search').value === '#fyp',
				document.getElementById('search').value);
			check('and the lightbox gets out of the way of the results',
				document.getElementById('lightbox').classList.contains('hidden'));
			// 444 is `#fypage`: a substring search is what makes a tag find the
			// near-misses beside it, which is half of why anyone clicks one.
			const tagged = [...document.querySelectorAll('.tile')].map((el) => el.dataset.id);
			check('and the grid holds everything tagged like it', String(tagged) === '333,444', String(tagged));

			// Everything below counts tiles, so the grid goes back to the whole of it.
			document.getElementById('search').value = '';
			renderLibrary(state);

			lines.push('', failures
				? `<span class="fail">${failures} of ${checks} failing</span>`
				: `<span class="pass">all ${checks} passing</span>`);
			out.innerHTML = lines.join('\n');
		</script>
	</body>
</html>
